name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --exclude "**/content/legal/provider.test.ts"

      # Intentionally red until real operator/legal facts (Impressum, EU-Vertreter,
      # USt-IdNr.) are supplied in src/content/legal/provider.ts -- see that file's
      # header comment. continue-on-error keeps this from blocking the PR check while
      # still surfacing the failure in the Actions log, instead of silently faking the
      # data to turn it green.
      - name: Test (legal-facts gate, informational only)
        run: npx vitest run src/content/legal/provider.test.ts
        continue-on-error: true
